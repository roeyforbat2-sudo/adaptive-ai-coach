# Local-only dashboard. Bound to localhost; usage statistics disabled.
[server]
address = "localhost"
port = 8501
headless = true
runOnSave = false

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0e1014"
secondaryBackgroundColor = "#16181d"
textColor = "#f0efec"
font = "sans serif"
